<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Spelling Kids App</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #f4f6f8;
  font-size: 20px;
}

header {
  background: #4a90e2;
  color: white;
  padding: 20px;
  text-align: center;
  font-size: 28px;
}

.page {
  display: none;
  padding: 20px;
}

.active {
  display: block;
}

.card {
  background: white;
  padding: 20px;
  margin: 15px 0;
  border-radius: 15px;
  box-shadow: 0 3px 8px rgba(0,0,0,0.1);
}

button {
  width: 100%;
  padding: 18px;
  margin-top: 12px;
  border: none;
  border-radius: 12px;
  font-size: 22px;
}

input, textarea {
  width: 100%;
  padding: 15px;
  font-size: 22px;
  border-radius: 10px;
  border: 1px solid #ccc;
}

#progress {
  font-size: 24px;
}

#result {
  font-size: 28px;
  font-weight: bold;
  margin-top: 10px;
  text-align: center;
}

.blue { background:#4a90e2; color:white; }
.green { background:#27ae60; color:white; }
.red { background:#e74c3c; color:white; }
</style>
</head>

<body>

<header>📚 Spelling Kids App</header>

<!-- HOME -->
<div id="home" class="page active">
  <div class="card">
    <h3>📂 單字簿</h3>
    <div id="bookList"></div>
    <button class="green" onclick="showCreate()">➕ 新增單字簿</button>
  </div>
</div>

<!-- EDIT -->
<div id="edit" class="page">
  <div class="card">
    <h3>✏️ 編輯單字簿</h3>
    <input id="bookName" placeholder="單字簿名稱">
    <textarea id="wordList" rows="6" placeholder="每行一個單字"></textarea>

    <button class="blue" onclick="saveBook()">💾 儲存</button>
    <button class="green" onclick="startTest()">開始測驗</button>
    <button class="red" onclick="backHome()">⬅ 回首頁</button>
  </div>
</div>

<!-- TEST -->
<div id="test" class="page">
  <div class="card">
    <h3>🧠 測驗</h3>

    <p id="progress"></p>

    <button class="green" onclick="playWord()">🔊 再聽一次</button>

    <input id="answer" placeholder="請輸入單字">

    <button class="blue" onclick="checkAnswer()">提交</button>

    <p id="result"></p>

    <button class="red" onclick="backHome()">回首頁</button>
  </div>
</div>

<script>

let currentBook = "";
let words = [];
let wrong = [];
let index = 0;
let currentWord = "";

// ===== HOME =====
function renderBooks() {
  let list = document.getElementById("bookList");
  list.innerHTML = "";

  for (let i = 0; i < localStorage.length; i++) {
    let key = localStorage.key(i);

    let div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `
      <b style="font-size:24px">${key}</b>
      <button onclick="openBook('${key}')">打開</button>
    `;
    list.appendChild(div);
  }
}

function showCreate() {
  currentBook = "";
  document.getElementById("bookName").value = "";
  document.getElementById("wordList").value = "";
  switchPage("edit");
}

function openBook(name) {
  currentBook = name;
  document.getElementById("bookName").value = name;
  document.getElementById("wordList").value = localStorage.getItem(name);
  switchPage("edit");
}

// ===== SAVE =====
function saveBook() {
  let name = document.getElementById("bookName").value;
  let words = document.getElementById("wordList").value;

  localStorage.setItem(name, words);
  renderBooks();
  backHome();
}

// ===== TEST =====
function startTest() {
  words = document.getElementById("wordList").value
    .split("\n").map(w => w.trim()).filter(w => w);

  wrong = [];
  index = 0;

  switchPage("test");
  next();
}

function next() {
  if (index >= words.length) {

    if (wrong.length > 0) {
      words = wrong;
      wrong = [];
      index = 0;
      next();
      return;
    }

    document.getElementById("result").innerText = "🎉 完成！";
    return;
  }

  currentWord = words[index];
  document.getElementById("answer").value = "";
  document.getElementById("progress").innerText =
    `第 ${index+1} / ${words.length}`;

  // 👉 自動播放（慢速）
  setTimeout(playWord, 500);
}

function playWord() {
  let s = new SpeechSynthesisUtterance(currentWord);
  s.lang = "en-US";
  s.rate = 0.7;  // 👈 語速變慢（0.5~1之間）
  speechSynthesis.speak(s);
}

function checkAnswer() {
  let a = document.getElementById("answer").value.trim();

  if (a.toLowerCase() === currentWord.toLowerCase()) {
    document.getElementById("result").innerText = "🎉 正確！";
  } else {
    document.getElementById("result").innerText = "❌ 正確是：" + currentWord;
    wrong.push(currentWord);
  }

  index++;
  setTimeout(next, 1200);
}

// ===== NAV =====
function backHome() {
  renderBooks();
  switchPage("home");
}

function switchPage(page) {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.getElementById(page).classList.add("active");
}

renderBooks();

</script>

</body>
</html>
